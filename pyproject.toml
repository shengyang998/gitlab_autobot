[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gitlab-autobot"
version = "0.2.0"
description = "CLI tool to create GitLab merge requests."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "GitLab Autobot" }
]
dependencies = [
  "requests>=2.31",
]

[project.scripts]
gitlab-autobot = "gitlab_autobot.cli:main"

[tool.setuptools.package-data]
"gitlab_autobot" = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]
